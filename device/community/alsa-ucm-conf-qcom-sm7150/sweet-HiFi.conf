# Xiaomi Redmi Note 10 Pro (sweet): separate playback and capture frontends.
SectionVerb {
	Value { TQ "HiFi" }
}
SectionDevice."Speaker" {
	Comment "Built-in stereo speakers"
	ConflictingDevice [ "Headphones" ]
	EnableSequence [
		# Keep both model-specific ACF profiles; -50 dB below their baseline.
		# PulseAudio applies the user's volume in software.
		cset "name='Speaker Profile Set' Music"
		cset "name='Earpiece Profile Set' Music"
		cset "name='Speaker PCM Playback Volume' 160"
		cset "name='Earpiece PCM Playback Volume' 160"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
SectionDevice."Headphones" {
	Comment "Wired headphones"
	ConflictingDevice [ "Speaker" ]
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}
SectionDevice."Mic" {
	Comment "Built-in microphone"
	EnableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		# SM7150 uses the LPASS v9 ADC-named SoundWire input mux.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
	]
	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Include.txmicd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureMixerElem "ADC1"
	}
}
