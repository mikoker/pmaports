[Unit]
After=hexagonrpcd-adsp-rootpd.service
Requires=hexagonrpcd-adsp-rootpd.service
BindsTo=hexagonrpcd-adsp-rootpd.service
Upholds=iio-sensor-proxy.service

[Service]
Type=notify
NotifyAccess=main
TimeoutStartSec=90
# Allow RootPD/FastRPC to settle before attaching the sensors process.
# Concurrent startup can stall sensor_process initialization on sweet.
ExecStartPre=/bin/sleep 2
ExecStart=
ExecStart=/usr/libexec/hexagonrpcd-sweet -f /dev/fastrpc-adsp -d adsp -s
