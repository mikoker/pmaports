[Unit]
Before=sleep.target
Wants=hexagonrpcd-adsp-sensorspd.service
BindsTo=hexagonrpcd-adsp-sensorspd.service
After=hexagonrpcd-adsp-sensorspd.service
StartLimitIntervalSec=120
StartLimitBurst=12

[Service]
# SSC discovery can finish before physical sensors become available.
# The proxy exits successfully if its first probe finds no sensors.
Restart=always
RestartSec=5
