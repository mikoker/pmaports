[Unit]
# Finish listener teardown before any systemd-sleep operation starts.
# Before=suspend.target alone does not order us against its sleep service.
Before=sleep.target
# Restore the downstream listener if RootPD is automatically restarted.
Upholds=hexagonrpcd-adsp-sensorspd.service

[Service]
Type=notify
NotifyAccess=main
TimeoutStartSec=60
ExecStart=
ExecStart=/usr/libexec/hexagonrpcd-sweet -f /dev/fastrpc-adsp -d adsp
